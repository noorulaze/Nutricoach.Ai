<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Light Mode Diagonal Ribbon Gradient -->
    <linearGradient id="nc-fav-diag" x1="0.1" y1="0.1" x2="0.85" y2="0.85">
      <stop offset="0%" stop-color="#1B3824" />
      <stop offset="50%" stop-color="#3A633F" />
      <stop offset="100%" stop-color="#6F9662" />
    </linearGradient>

    <!-- Dark Mode Diagonal Ribbon Gradient -->
    <linearGradient id="nc-fav-diag-dark" x1="0.1" y1="0.1" x2="0.85" y2="0.85">
      <stop offset="0%" stop-color="#4B7243" />
      <stop offset="60%" stop-color="#68915C" />
      <stop offset="100%" stop-color="#8DB37F" />
    </linearGradient>

    <style>
      .nc-stem { fill: #162D1E; transition: fill 0.2s ease; }
      .nc-leaf { fill: #789C6A; transition: fill 0.2s ease; }
      .nc-diag-light { display: block; fill: url(#nc-fav-diag); opacity: 0.96; }
      .nc-diag-dark { display: none; fill: url(#nc-fav-diag-dark); opacity: 0.92; }

      @media (prefers-color-scheme: dark) {
        .nc-stem { fill: #DFECE0; }
        .nc-leaf { fill: #8EAF7F; }
        .nc-diag-light { display: none; }
        .nc-diag-dark { display: block; }
      }
    </style>
  </defs>

  <!-- Left Upright / Petal Contour -->
  <path
    class="nc-stem"
    d="M 18,88 C 10,64 11,36 22,20 C 27,12 36,10 44,14 L 44,28 C 36,34 30,50 30,72 C 28,82 24,88 18,88 Z"
  />

  <!-- Right Upright Leaf with Graceful Pointed Tip -->
  <path
    class="nc-leaf"
    d="M 64,88 C 65,66 68,44 88,14 C 92,38 90,64 78,84 C 74,88 68,89 64,88 Z"
  />

  <!-- Center Diagonal Overlapping Ribbon Fold -->
  <path class="nc-diag-light" d="M 22,22 L 44,14 L 78,84 L 64,88 Z" />
  <path class="nc-diag-dark" d="M 22,22 L 44,14 L 78,84 L 64,88 Z" />
</svg>